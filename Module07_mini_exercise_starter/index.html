<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Link CSS ของ Bootstrap และ Style หลัก -->
    <link rel="stylesheet" href="css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/style.css" />
    
    <!-- Link Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" />
    
    <title>CS100 Mini Exercises</title>
  </head>
  <body class="bg-light">

    <!-- Container หลักสำหรับรองรับเนื้อหาทุกข้อ -->
    <div class="container py-5">
      <!-- Mini Exercise 1: Pricing Cards -->
      <h2 class="text-center mb-4 fw-bold">Mini Exercise 1: Pricing Cards</h2>

      <div class="row row-cols-1 row-cols-md-3 g-4 mb-5 text-center">

        <!-- Card 1: Free -->
        <div class="col">
          <div class="card h-100 shadow-sm">
            <div class="card-header py-3">
              <h4 class="my-0 fw-normal">Free</h4>
            </div>
            <div class="card-body d-flex flex-column justify-content-between">
              <div>
                <h1 class="card-title pricing-card-title">฿0 <small class="text-muted fs-5">/เดือน</small></h1>
                <ul class="list-unstyled mt-3 mb-4">
                  <li>10 Users included</li>
                  <li>2 GB of storage</li>
                  <li>Email support</li>
                </ul>
              </div>
              <button type="button" class="w-100 btn btn-lg btn-outline-primary">Sign up for free</button>
            </div>
          </div>
        </div>

        <!-- Card 2: Pro -->
        <div class="col">
          <div class="card h-100 shadow-sm border-primary">
            <div class="card-header py-3 text-bg-primary border-primary">
              <h4 class="my-0 fw-normal">Pro</h4>
            </div>
            <div class="card-body d-flex flex-column justify-content-between">
              <div>
                <h1 class="card-title pricing-card-title">฿299 <small class="text-muted fs-5">/เดือน</small></h1>
                <ul class="list-unstyled mt-3 mb-4">
                  <li>20 Users included</li>
                  <li>10 GB of storage</li>
                  <li>Priority email support</li>
                </ul>
              </div>
              <button type="button" class="w-100 btn btn-lg btn-primary">Get started</button>
            </div>
          </div>
        </div>

        <!-- Card 3: Enterprise -->
        <div class="col">
          <div class="card h-100 shadow-sm">
            <div class="card-header py-3">
              <h4 class="my-0 fw-normal">Enterprise</h4>
            </div>
            <div class="card-body d-flex flex-column justify-content-between">
              <div>
                <h1 class="card-title pricing-card-title">฿999 <small class="text-muted fs-5">/เดือน</small></h1>
                <ul class="list-unstyled mt-3 mb-4">
                  <li>Unlimited Users</li>
                  <li>100 GB of storage</li>
                  <li>Phone & Email support</li>
                </ul>
              </div>
              <button type="button" class="w-100 btn btn-lg btn-primary">Contact us</button>
            </div>
          </div>
        </div>

      </div>
    </div>

    <!-- Link JS ของ Bootstrap -->
    <script src="js/bootstrap.bundle.min.js"></script>
  </body>
</html>
